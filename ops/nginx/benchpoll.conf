upstream benchpoll_app {
    server 127.0.0.1:1337;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name benchpoll.com www.benchpoll.com _;
    return 308 https://benchpoll.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name benchpoll.com www.benchpoll.com _;

    ssl_certificate /etc/letsencrypt/live/benchpoll.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benchpoll.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20m;

    include /etc/nginx/snippets/benchpoll-cloudflare-real-ip.conf;

    location / {
        proxy_pass https://benchpoll_app;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
