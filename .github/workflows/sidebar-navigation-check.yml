name: Sidebar navigation verification
on:
  push:
    branches: [work/sidebar-navigation-20260922]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package pinned dependencies only
        run: tar -czf /tmp/benchpoll-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: benchpoll-dependencies
          path: /tmp/benchpoll-dependencies.tar.gz
          retention-days: 1
