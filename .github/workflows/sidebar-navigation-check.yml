name: Sidebar navigation verification
on:
  push:
    branches: [work/sidebar-navigation-20260922]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/sidebar-navigation-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply account isolation guard
        run: |
          git apply --check .github/sidebar-transfer/safety.patch
          git apply .github/sidebar-transfer/safety.patch
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Lint and Node tests
        run: |
          set -o pipefail
          mkdir -p artifacts/navigation
          npm run lint 2>&1 | tee artifacts/navigation/lint.log
          npm test 2>&1 | tee artifacts/navigation/unit.log
      - name: Existing browser regressions
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:frontend 2>&1 | tee artifacts/navigation/existing-browser.log
      - name: Sidebar browser regressions
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:navigation 2>&1 | tee artifacts/navigation/sidebar-browser.log
      - name: Require both browser suites
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for file in ['artifacts/frontend/results.json','artifacts/navigation/results.json']:
              rows = json.loads(Path(file).read_text())
              print(file, sum(row['passed'] for row in rows), '/', len(rows))
              assert rows and all(row['passed'] for row in rows), file
          PY
      - name: Preserve verified feature tree on isolated branch
        run: |
          git config user.name 'BenchPoll verification'
          git config user.email 'benchpoll-verification@users.noreply.github.com'
          git add public/js/home.js scripts/frontend/navigation.mjs docs/sidebar-navigation.md
          git diff --cached --check
          git commit -m 'fix: isolate editable workspace when account changes [skip ci]'
          git push origin HEAD:work/sidebar-navigation-20260922
          git rev-parse HEAD | tee artifacts/navigation/verified-commit.txt
          git rev-parse HEAD^{tree} | tee artifacts/navigation/verified-tree.txt
          git ls-tree -r HEAD > artifacts/navigation/verified-manifest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-navigation-results
          path: artifacts/
          retention-days: 7
