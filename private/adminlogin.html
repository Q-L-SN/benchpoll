<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewer Access - BenchPoll</title>
    <link rel="icon" href="/favicon.ico?v=benchpoll-g-2" sizes="any">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=benchpoll-g-2">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/adminlogin.css">
    <script src="/js/global.js" type="module"></script>
    <script src="/js/adminlogin.js" type="module"></script>
    <link rel="stylesheet" href="/css/ui/tokens.css?v=frontend-20260905">
</head>
<body class="admin-login-page">
    <global-header>
        <a class="header-link" href="/">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Rankings</span>
        </a>
    </global-header>
    <main class="admin-login-shell">
        <section class="admin-login-intro" aria-labelledby="title">
            <p class="eyebrow">Review</p>
            <h1 id="title">Moderation access</h1>
            <p class="intro-copy">Reviewer access uses your normal GitHub-backed BenchPoll account.</p>
            <p class="restricted-note"><i class="fa-solid fa-lock" aria-hidden="true"></i> Checking account permissions</p>
        </section>
        <section class="admin-login-form" aria-label="Reviewer access">
            <div class="form-heading">
                <div class="form-mark" aria-hidden="true">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h2>Opening the review workspace</h2>
                    <p>There is no separate reviewer password.</p>
                </div>
            </div>
            <a id="loginButton" href="/censor">
                <span>Continue with BenchPoll</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>
    </main>
</body>
</html>
