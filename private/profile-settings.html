<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex"><title>Settings · BenchPoll</title>
    <link rel="icon" href="/favicon.ico" sizes="any"><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/ui/tokens.css"><link rel="stylesheet" href="/css/ui/site-header.css">
    <link rel="stylesheet" href="/css/typography.css"><link rel="stylesheet" href="/css/profile.css">
    <script type="module" src="/js/profile-settings.js"></script>
</head>
<body class="bp-profile-page">
    <a class="pf-skip" href="#settings-content">Skip to settings</a>
    <header class="bp-site-header"><div class="bp-site-header-inner"><a class="bp-site-brand" href="/" aria-label="BenchPoll home"><img src="/assets/benchpoll-logo.svg" alt="BenchPoll" width="150" height="31"></a><nav id="profile-site-links"></nav></div></header>
    <main id="settings-content" class="pf-main pf-settings" tabindex="-1">
        <a class="pf-back" href="/me"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Your profile</a>
        <h1 id="settings-title">Settings</h1>
        <div class="pf-settings-layout">
            <div class="pf-settings-nav" role="tablist" aria-label="Settings">
                <button type="button" role="tab" id="tab-profile" aria-controls="settings-profile" aria-selected="true">Profile</button>
                <button type="button" role="tab" id="tab-privacy" aria-controls="settings-privacy" aria-selected="false" tabindex="-1">Privacy</button>
                <button type="button" role="tab" id="tab-delete" aria-controls="settings-delete" aria-selected="false" tabindex="-1">Delete account</button>
                <button type="button" role="tab" id="tab-logout" aria-controls="settings-logout" aria-selected="false" tabindex="-1">Log out</button>
            </div>
            <div id="settings-panel"><p id="settings-status" class="pf-status" role="status"></p>
                <div id="settings-view">
                    <section role="tabpanel" id="settings-profile" aria-labelledby="tab-profile"></section>
                    <section role="tabpanel" id="settings-privacy" aria-labelledby="tab-privacy" hidden></section>
                    <section role="tabpanel" id="settings-delete" aria-labelledby="tab-delete" hidden></section>
                    <section role="tabpanel" id="settings-logout" aria-labelledby="tab-logout" hidden></section>
                </div>
            </div>
        </div>
        <noscript>JavaScript is required to update settings.</noscript>
    </main>
</body>
</html>
