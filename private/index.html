<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--bp:metadata--><title>BenchPoll - We believe in benchmarks. Not a narrow selection.</title>
    <meta name="description" content="Choose what matters. Shape the weights together. Compare AI on what matters to you."><!--/bp:metadata-->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/css/ui/tokens.css">
    <link rel="stylesheet" href="/css/ui/tooltip.css">
    <link rel="stylesheet" href="/css/site-palette.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/ui/profile-editor.css" data-bp-profile-editor>
    <link rel="stylesheet" href="/css/ui/account-center.css" data-bp-account-center>
    <link rel="stylesheet" href="/css/ui/topic-identity.css">
    <link rel="stylesheet" href="/css/ui/site-header.css">
    <link rel="stylesheet" href="/css/topics-home.css">
    <link rel="stylesheet" href="/css/ui/model-search.css?v=20261028">
    <link rel="stylesheet" href="/css/workspace-model-focus.css?v=home-model-focus-20261024">
    <link rel="stylesheet" href="/css/ui/search-presentation.css">
    <script src="/js/topics-home.js" type="module"></script>
</head>
<body class="th-home" data-weight-theme="frost-hatch" data-card-style="outline">
    <a class="th-skip" href="#topics">Skip to topics</a>
    <div class="th-header-placeholder"><header class="th-header">
        <div class="th-header-inner th-container">
            <a class="th-brand" href="/" aria-label="BenchPoll home"><img src="/assets/benchpoll-logo.svg" alt="BenchPoll" width="330" height="67"></a>
            <nav id="topics-navigation" class="th-directory-nav" aria-label="Topic directory">
                <div class="th-topic-tabs" role="tablist" aria-label="Topic collections">
                    <button id="topics-popular" type="button" role="tab" data-topics-view="popular" aria-selected="true" aria-controls="topics-grid" aria-label="Popular" data-tooltip="Popular"><i class="fa-solid fa-fire" aria-hidden="true"></i><span>Popular</span></button>
                    <button id="topics-recent" type="button" role="tab" data-topics-view="recent" aria-selected="false" aria-controls="topics-grid" aria-label="Recent" data-tooltip="Recent" tabindex="-1"><i class="fa-solid fa-clock" aria-hidden="true"></i><span>Recent</span></button>
                    <button id="topics-configured" type="button" role="tab" data-topics-view="configured" aria-selected="false" aria-controls="topics-grid" aria-label="Mine" data-tooltip="Mine" tabindex="-1"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Mine</span></button>
                    <button id="topic-search-toggle" type="button" role="tab" data-topics-view="search" aria-label="Search topics" data-tooltip="Search topics" aria-selected="false" aria-controls="topic-search-panel topics-grid" aria-expanded="false" tabindex="-1"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Search</span></button>
                </div>
            </nav>
            <nav class="th-header-links" aria-label="About and account"></nav>
        </div>
        <label id="topic-search-panel" class="th-search" hidden><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="topic-search" type="search" placeholder="Search topics" aria-label="Search topics" maxlength="200" autocomplete="off"><button id="topic-search-close" class="th-icon" type="button" aria-label="Close search" data-tooltip="Close search"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></label>
    </header></div>
            <div id="topics-filters" class="th-filter-bar" role="group" aria-label="Topic preview settings" hidden>
                <button id="topics-score-toggle" class="th-display-action" type="button" aria-label="Switch to score range" aria-pressed="false" data-tooltip="Switch to score range"><i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i><span>Estimated score</span></button>
                <div class="th-comparison-controls" role="group" aria-label="Compare separately">
                    <button class="th-icon bp-comparison-icon" type="button" data-comparison="reasoning" aria-label="Compare reasoning effort separately" data-tooltip="Compare reasoning effort separately" aria-pressed="false"><i class="fa-solid fa-brain" aria-hidden="true"></i></button>
                    <button class="th-icon bp-comparison-icon" type="button" data-comparison="harness" aria-label="Compare harnesses separately" data-tooltip="Compare harnesses separately" aria-pressed="false"><i class="fa-solid fa-puzzle-piece" aria-hidden="true"></i></button>
                </div>
                <div id="home-model-search" class="bp-model-search"></div>
                <button id="topics-view-toggle" class="th-display-action th-view-toggle" type="button" aria-label="Switch to benchmark weights" aria-pressed="false" data-tooltip="Switch to benchmark weights"><i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i><span>Models</span><i class="fa-solid fa-chart-column th-view-indicator" aria-hidden="true"></i></button>
            </div>
    <p id="account-status" class="th-account-status th-container" role="status" hidden></p>
    <main class="th-container">
        <section id="home-hero" class="th-intro" aria-labelledby="home-title">
            <h1 id="home-title"><span class="th-headline-phrase">We believe in benchmarks.</span> <span class="th-headline-phrase th-headline-accent">Not a narrow selection.</span></h1>
            <p class="th-intro-copy">Choose what matters. Shape the weights together.</p>
            <a id="beta-feedback-link" class="th-quiet th-beta-feedback" href="/contribute/feedback"><i class="fa-regular fa-comment-dots" aria-hidden="true"></i><span>BenchPoll is in beta. Tell us what to improve.</span></a>
        </section>
        <section id="topics" class="th-topics" aria-label="Topic previews">
            <div id="mine-actions" class="th-directory-actions" hidden><button id="new-private-topic" class="th-private-action" type="button" aria-label="New private topic" data-tooltip="New private topic"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>New private topic</span><i class="fa-solid fa-lock" aria-hidden="true"></i></button></div>
            <div id="topics-status" class="th-list-status" role="status">Loading topics...</div>
            <div id="topics-grid" class="th-grid" role="tabpanel" aria-labelledby="topics-popular" aria-busy="false"><!--bp:directory--><!--/bp:directory--></div>
            <p id="topics-announcement" class="th-sr-only" role="status" aria-live="polite"></p>
        </section>
    </main>
    <noscript><style>#topics-status,.th-directory-nav,.th-beta-feedback{display:none}.th-server-card,.th-server-card.is-featured{height:auto;min-height:160px;grid-template-rows:auto auto auto}.th-server-card .th-card-header{height:auto;display:block}.th-server-card .th-card-identity{max-width:none}.th-server-card .th-topic-summary{white-space:normal;mask-image:none;-webkit-mask-image:none}.th-server-card .th-visual{min-height:56px}</style><nav aria-label="About BenchPoll"><a href="/how-it-works">How it works</a> <a href="/terms">Terms</a> <a href="/privacy">Privacy</a></nav></noscript>
    <dialog id="create-topic-dialog" class="th-dialog" aria-labelledby="create-topic-title">
        <form id="create-topic-form">
            <div class="th-dialog-heading"><h2 id="create-topic-title">New private topic</h2><button class="th-icon" type="button" data-close-create aria-label="Close new topic" data-tooltip="Close"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
            <label class="th-field">Name<input id="new-topic-name" name="name" required maxlength="128" autocomplete="off"></label>
            <label class="th-field">One-sentence summary<input id="new-topic-description" name="description" required maxlength="180" autocomplete="off"></label>
            <div id="create-topic-status" class="th-form-status" role="status" hidden></div>
            <div class="th-dialog-actions"><button class="th-quiet" type="button" data-close-create>Cancel</button><button id="create-topic-submit" class="th-primary" type="submit"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>Create private topic</span></button></div>
        </form>
    </dialog>
</body>
</html>
